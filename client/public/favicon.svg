<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="ballGlow" cx="50%" cy="50%" r="50%">
      <stop offset="65%" stop-color="#ff7b00" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff4500" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ballShading" cx="32%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f1f5f9"/>
      <stop offset="85%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </radialGradient>
    <linearGradient id="patchColor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <!-- Ambient Outer Glow -->
  <circle cx="32" cy="32" r="31" fill="url(#ballGlow)"/>

  <!-- Soccer Ball Base -->
  <circle cx="32" cy="32" r="28" fill="url(#ballShading)" stroke="#ff6a00" stroke-width="1.5"/>

  <!-- Center Black Pentagon -->
  <polygon points="32,20 41,27 38,38 26,38 23,27" fill="url(#patchColor)" stroke="#0f172a" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Top Patch -->
  <polygon points="32,4 26,9 28,14 36,14 38,9" fill="url(#patchColor)" stroke="#0f172a" stroke-width="1.2" stroke-linejoin="round"/>
  <line x1="32" y1="14" x2="32" y2="20" stroke="#0f172a" stroke-width="1.4"/>

  <!-- Top-Left Seams & Edge Patch -->
  <polygon points="9,17 14,13 18,16 16,22 10,23" fill="url(#patchColor)" stroke="#0f172a" stroke-width="1.2" stroke-linejoin="round"/>
  <line x1="26" y1="9" x2="18" y2="16" stroke="#0f172a" stroke-width="1.4"/>
  <line x1="23" y1="27" x2="16" y2="22" stroke="#0f172a" stroke-width="1.4"/>

  <!-- Top-Right Seams & Edge Patch -->
  <polygon points="55,17 50,13 46,16 48,22 54,23" fill="url(#patchColor)" stroke="#0f172a" stroke-width="1.2" stroke-linejoin="round"/>
  <line x1="38" y1="9" x2="46" y2="16" stroke="#0f172a" stroke-width="1.4"/>
  <line x1="41" y1="27" x2="48" y2="22" stroke="#0f172a" stroke-width="1.4"/>

  <!-- Bottom-Left Seams & Edge Patch -->
  <polygon points="10,45 15,40 21,43 19,49 13,50" fill="url(#patchColor)" stroke="#0f172a" stroke-width="1.2" stroke-linejoin="round"/>
  <line x1="16" y1="22" x2="10" y2="34" stroke="#0f172a" stroke-width="1.4"/>
  <line x1="10" y1="34" x2="15" y2="40" stroke="#0f172a" stroke-width="1.4"/>
  <line x1="26" y1="38" x2="21" y2="43" stroke="#0f172a" stroke-width="1.4"/>

  <!-- Bottom-Right Seams & Edge Patch -->
  <polygon points="54,45 49,40 43,43 45,49 51,50" fill="url(#patchColor)" stroke="#0f172a" stroke-width="1.2" stroke-linejoin="round"/>
  <line x1="48" y1="22" x2="54" y2="34" stroke="#0f172a" stroke-width="1.4"/>
  <line x1="54" y1="34" x2="49" y2="40" stroke="#0f172a" stroke-width="1.4"/>
  <line x1="38" y1="38" x2="43" y2="43" stroke="#0f172a" stroke-width="1.4"/>

  <!-- Bottom-Center Patch -->
  <polygon points="32,60 26,55 29,49 35,49 38,55" fill="url(#patchColor)" stroke="#0f172a" stroke-width="1.2" stroke-linejoin="round"/>
  <line x1="21" y1="43" x2="26" y2="55" stroke="#0f172a" stroke-width="1.4"/>
  <line x1="43" y1="43" x2="38" y2="55" stroke="#0f172a" stroke-width="1.4"/>
  <line x1="26" y1="38" x2="29" y2="49" stroke="#0f172a" stroke-width="1.4"/>
  <line x1="38" y1="38" x2="35" y2="49" stroke="#0f172a" stroke-width="1.4"/>
</svg>
